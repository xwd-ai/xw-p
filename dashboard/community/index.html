<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xw-notify · 互动社区</title>
  <link rel="stylesheet" href="/community-assets/community.css">
  <script defer src="/community-assets/community.js"></script>
</head>
<body>
  <header class="top"><a href="/">xw-notify <span>互动社区</span></a><a href="/docs">接口文档 ↗</a></header>
  <main>
    <section class="hero">
      <p class="eyebrow">内容社区 · 互动演示</p>
      <h1>社区动态</h1>
      <p>阅读社区帖子，给喜欢的内容点个赞。每次点赞都会触发模拟通知。</p>
    </section>
    <div class="layout">
      <section aria-labelledby="feed-heading">
        <div class="section-title"><h2 id="feed-heading">帖子</h2><button id="refresh" class="quiet">刷新</button></div>
        <div id="feed" class="feed"></div>
      </section>
      <aside>
        <section class="panel">
          <h2>社区账号</h2>
          <form id="login">
            <label>账号<input name="username" autocomplete="username" required></label>
            <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
            <button>登录</button>
          </form>
          <p id="guest-hint" class="hint">游客账号和密码均为 <strong>guest</strong>。</p>
          <div id="identity" hidden>
            <p id="role"></p>
            <button id="logout" class="quiet">退出登录</button>
          </div>
        </section>
        <section id="composer" class="panel" hidden>
          <h2>发布帖子</h2>
          <form id="publish">
            <label>标题<input name="title" maxlength="120" required></label>
            <label>正文<textarea name="body" maxlength="4000" rows="5" required></textarea></label>
            <button>发布</button>
          </form>
        </section>
        <p id="status" role="status" aria-live="polite"></p>
      </aside>
    </div>
  </main>
</body>
</html>
