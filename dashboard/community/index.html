<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾页 · 生活分享社区</title>
  <link rel="stylesheet" href="/community-assets/community.css?v=3">
  <script defer src="/community-assets/community.js?v=6"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="./"><span>拾页</span> <strong>生活社区</strong></a>
    <nav aria-label="主导航">
      <button id="discover" class="nav active" aria-current="page"><span aria-hidden="true">⌂</span> 发现</button>
      <button id="manage" class="nav" hidden><span aria-hidden="true">▤</span> 社区管理</button>
      <div id="notification-nav" hidden>
        <p class="hint">通知平台</p>
        <button class="nav" data-console-view="dashboard">仪表盘</button>
        <button class="nav" data-console-view="workflows">工作流编排</button>
        <button class="nav" data-console-view="activity">活动流</button>
        <button class="nav" data-console-view="inbox">收件箱</button>
        <button class="nav" data-console-view="subscribers">创作者</button>
        <button class="nav" data-console-view="settings">设置</button>
        <button class="nav" data-console-view="operations">运营后台</button>
      </div>
    </nav>
    <section class="account">
      <form id="login">
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary">登录</button>
      </form>
      <p id="guest-hint" class="hint">使用站长提供的账号登录</p>
      <div id="identity" hidden><p id="role"></p><button id="logout" class="quiet">退出登录</button></div>
    </section>
    <p class="tagline">记录日常，发现同好。</p>
  </aside>
  <main>
    <section id="login-required"><h1>欢迎来到拾页</h1><p>请登录后浏览社区帖子。</p></section>
    <section id="discovery" hidden>
      <header class="toolbar">
        <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" aria-label="搜索帖子" placeholder="搜索你感兴趣的内容"></label>
        <button id="refresh" class="quiet" aria-label="刷新帖子">↻</button>
      </header>
      <div id="categories" class="categories" aria-label="帖子分类"></div>
      <h1 class="sr-only">社区动态</h1>
      <div id="feed" class="feed"></div>
    </section>
    <section id="admin" hidden>
      <header class="admin-heading"><div><p class="hint">站长工作台</p><h1>社区概况</h1></div><button id="refresh-overview" class="quiet">刷新数据</button></header>
      <div class="metrics">
        <div><span>帖子总数</span><strong id="post-count">—</strong></div>
        <div><span>帖子点赞数</span><strong id="like-count">—</strong></div>
        <div><span>未读通知</span><strong id="unread-count">—</strong></div>
      </div>
      <div class="admin-grid">
        <section id="console-entry" class="panel">
          <h2>通知平台</h2>
          <p><a class="quiet" href="/community/">进入统一站长工作台 ↗</a></p>
        </section>
        <section class="panel"><h2>最新通知</h2><div id="notifications"></div></section>
        <section id="composer" class="panel" hidden>
          <h2>发布帖子</h2>
          <form id="publish">
            <label>标题<input name="title" maxlength="120" required></label>
            <label>正文<textarea name="body" maxlength="4000" rows="5" required></textarea></label>
            <button class="primary">发布</button>
          </form>
        </section>
        <section class="panel">
          <h2>访客账号</h2>
          <p id="guest-accounts" class="hint"></p>
          <form id="save-guest">
            <label>访客账号<input name="username" pattern="[a-z][a-z0-9_\-]{2,23}" maxlength="24" required></label>
            <label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label>
            <button class="primary">创建或重置账号</button>
          </form>
        </section>
      </div>
    </section>
    <section id="notification-platform" aria-label="通知平台" hidden>
      <iframe id="console-frame" class="console-frame" title="内容社区互动触达"></iframe>
      <iframe id="operations-frame" class="console-frame" title="运营后台" hidden></iframe>
    </section>
    <p id="status" role="status" aria-live="polite" hidden></p>
  </main>
  <dialog id="detail">
    <form method="dialog"><button class="quiet" aria-label="关闭帖子详情">×</button></form>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
