name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, engine, demo]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-$SERVICE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: xw-notify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: 更新服务并检查站点
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_HOST: ${{ vars.XW_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.XW_DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ vars.XW_DEPLOY_USER }}
          PUBLIC_URL: ${{ vars.XW_PUBLIC_URL || 'https://xwp.xwd.info' }}
          SSH_KEY: ${{ secrets.XW_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.XW_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" != "$RELEASE_SHA" ]]; then
            echo "Skipping superseded release $RELEASE_SHA"
            exit 0
          fi

          : "${DEPLOY_HOST:?Missing XW_DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing XW_DEPLOY_USER}"
          : "${SSH_KEY:?Missing XW_DEPLOY_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing XW_DEPLOY_KNOWN_HOSTS}"
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$SSH_KEY" > "$key_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          ssh_args=(-p "$DEPLOY_PORT" -i "$key_dir/key" -o IdentitiesOnly=yes
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15
            -o "UserKnownHostsFile=$key_dir/known_hosts")
          target="$DEPLOY_USER@$DEPLOY_HOST"
          if ! ssh "${ssh_args[@]}" -- "$target" xw-release-check > /dev/null; then
            echo "服务器未就绪：$target 需要已安装 receive.sh 与 apply.sh，" >&2
            echo "且该密钥在 authorized_keys 中绑定 restrict,command= 指向 receive.sh。" >&2
            exit 1
          fi
          [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9_-]+$ ]]
          { printf '%s\n' "$GH_TOKEN"; cat infra/release/compose.yml; } |
            ssh "${ssh_args[@]}" -- "$target" "xw-release $RELEASE_SHA $GITHUB_ACTOR"
          curl --fail --silent --show-error --location --max-time 15 --retry 4 \
            --retry-connrefused "${PUBLIC_URL%/}/" > /dev/null
